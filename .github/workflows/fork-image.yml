---
name: Fork image

# Builds a container image of this fork of Terraform for linux/amd64 and
# linux/arm64 and publishes it to the GitHub Container Registry, as
# ghcr.io/<owner>/<repository>.
#
# Nothing is published unless three things pass for the same commit:
#
#   - upstream's own unit tests, for every Go module in the repository,
#   - the race detector on the packages that upstream runs it on and the ones
#     that the fork changed, and
#   - the integrity proof (fork-proof/README.md), which builds upstream at
#     the commit in fork-proof/UPSTREAM_REF and compares it with the fork.
#
# The proof's report is attached to the image as a signed attestation, along
# with a provenance attestation, so that the claim and the image it's about
# can't be separated. Check them with:
#
#   gh attestation verify oci://<image>@<digest> --repo <owner>/<repository>
#   gh attestation verify oci://<image>@<digest> --repo <owner>/<repository> \
#     --predicate-type https://cozybear.dev/terraform/fork-proof/v1
#
# This belongs to the fork. It has nothing to do with the upstream build and
# release workflows, and never runs in the upstream repository.

on:
  push:
    branches:
      - perf/large-state
      - 'perf/v*'
    tags:
      - 'v*-perf.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    if: github.repository != 'hashicorp/terraform'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version

      # The same thing that upstream's checks run: every test of every Go
      # module in the repository.
      - name: Unit tests
        run: |
          for dir in $(go list -m -f '{{.Dir}}' github.com/hashicorp/terraform/...); do
            (cd $dir && go test "./...")
          done

  race-tests:
    name: Race tests
    if: github.repository != 'hashicorp/terraform'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version

      # The packages that upstream runs the race detector on, and then the
      # ones where the fork does work concurrently that upstream doesn't.
      - name: Race detector
        run: |
          go test -race \
            ./internal/terraform \
            ./internal/command \
            ./internal/states/... \
            ./internal/promising \
            ./internal/stacks/... \
            ./internal/plans/... \
            ./internal/backend/local/... \
            ./internal/dag/... \
            ./internal/instances/... \
            ./internal/namedvals/... \
            ./internal/refactoring/... \
            ./internal/lang/... \
            ./internal/addrs/... \
            ./internal/getmodules/... \
            ./internal/initwd/... \
            ./internal/parallel/...
          (cd internal/backend/remote-state/gcs && go test -race .)

  proof:
    name: Integrity proof
    if: github.repository != 'hashicorp/terraform'
    uses: ./.github/workflows/fork-proof.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      tier: ci

  image:
    name: Build and publish
    needs: [unit-tests, race-tests, proof]
    if: github.repository != 'hashicorp/terraform' && needs.proof.outputs.verdict == 'identical'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide names
        id: names
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          ref="${GITHUB_REF_NAME//\//-}"
          short="${GITHUB_SHA::12}"
          upstream="$(cat fork-proof/UPSTREAM_REF)"
          version="$(cat version/VERSION)"
          {
            echo "image=${image}"
            echo "go-version=$(cat .go-version)"
            echo "upstream=${upstream}"
            # What "terraform version" says about the build, after the
            # version, which stays upstream's.
            echo "fork-build=${GITHUB_REPOSITORY}@${short} (${GITHUB_REF_NAME}) on upstream ${version} at ${upstream::12}"
            # A branch named for a release of upstream's is based on that
            # release, and so is a tag. Anything else is based on upstream's
            # development branch.
            case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
              tag:*|branch:perf/v*) echo "version-dev=no" ;;
              *) echo "version-dev=yes" ;;
            esac
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              # v1.2.3-perf.4 is published as 1.2.3-perf.4.
              echo "tags=${image}:${GITHUB_REF_NAME#v}"
              echo "main-tag=${image}:${GITHUB_REF_NAME#v}"
            else
              echo "tags=${image}:${ref},${image}:${ref}-${short}"
              echo "main-tag=${image}:${ref}-${short}"
            fi
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-proof-report
          path: proof

      - name: Check that the report is the one the proof described
        run: |
          echo "${{ needs.proof.outputs.report-sha256 }}  proof/report.json" | sha256sum --check

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.fork
          platforms: linux/amd64,linux/arm64
          push: true
          # The attestations below say where the image came from. This
          # would add a second, differently shaped statement of the same.
          provenance: false
          build-args: |
            GO_VERSION=${{ steps.names.outputs.go-version }}
            FORK_BUILD=${{ steps.names.outputs.fork-build }}
            VERSION_DEV=${{ steps.names.outputs.version-dev }}
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Terraform (large state performance fork)
            org.opencontainers.image.description=Unofficial build of Terraform from ${{ github.repository }}, ${{ github.ref_name }}. See README-FORK.md.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BUSL-1.1
            dev.cozybear.terraform.upstream-commit=${{ steps.names.outputs.upstream }}
            dev.cozybear.terraform.proof-verdict=${{ needs.proof.outputs.verdict }}
            dev.cozybear.terraform.proof-report-sha256=${{ needs.proof.outputs.report-sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the published image
        run: |
          docker run --rm "${{ steps.names.outputs.main-tag }}" version
          docker buildx imagetools inspect "${{ steps.names.outputs.main-tag }}"

      # The statement "this image was built by this workflow from this
      # commit", signed with the workflow's identity.
      - name: Attest where the image came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The statement "this is the report of the integrity proof for the
      # commit that this image was built from", attached to the image.
      - name: Attest the proof report
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://cozybear.dev/terraform/fork-proof/v1
          predicate-path: proof/report.json
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tags | \`${{ steps.names.outputs.tags }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo "| Fork commit | \`${{ github.sha }}\` |"
            echo "| Upstream commit | \`${{ steps.names.outputs.upstream }}\` |"
            echo "| Proof verdict | ${{ needs.proof.outputs.verdict }} |"
            echo "| Proof report (sha256) | \`${{ needs.proof.outputs.report-sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
