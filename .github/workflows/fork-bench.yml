---
name: Fork benchmark
run-name: "Benchmark terraform show on ${{ inputs.fork_ref }}"

# Measures "terraform show -no-color PLANFILE" with a branch or commit of the
# fork and with the upstream commit that it's based on, on generated
# configurations that use the Vault and Google providers, and checks that
# both print exactly the same thing. It publishes nothing: the timings are on
# the run's summary page, and the fork's CPU and wall-clock profiles are in
# its artifacts.
#
# It runs here rather than on anyone's machine because it builds Terraform
# twice and creates tens of thousands of objects.

on:
  workflow_dispatch:
    inputs:
      fork_ref:
        description: "Branch or commit of the fork to measure"
        required: true
        type: string
        default: perf/v1.17.0-rc1
      runs:
        description: "How many times each binary shows each plan"
        required: false
        type: string
        default: "3"

permissions:
  contents: read

env:
  UPSTREAM_URL: https://github.com/hashicorp/terraform.git

jobs:
  build:
    name: Build the fork and upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fork_commit: ${{ steps.get.outputs.fork_commit }}
      upstream_commit: ${{ steps.get.outputs.upstream_commit }}
    steps:
      - name: Get the fork and the upstream commit it's on
        id: get
        env:
          FORK_REF: ${{ inputs.fork_ref }}
        run: |
          set -euo pipefail
          git init --quiet fork
          git -C fork fetch --quiet --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$FORK_REF"
          git -C fork checkout --quiet FETCH_HEAD
          upstream_commit=$(tr -d '[:space:]' < fork/fork-proof/UPSTREAM_REF)
          git init --quiet upstream
          git -C upstream fetch --quiet --no-tags --depth=1 "$UPSTREAM_URL" "$upstream_commit"
          git -C upstream checkout --quiet FETCH_HEAD
          {
            echo "fork_commit=$(git -C fork rev-parse HEAD)"
            echo "upstream_commit=$upstream_commit"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fork/.go-version
          cache: false

      - name: Build both
        run: |
          set -euo pipefail
          mkdir bin
          (cd fork && go build -trimpath -o ../bin/terraform-fork .) &
          fork=$!
          (cd upstream && go build -trimpath -o ../bin/terraform-upstream .) &
          upstream=$!
          wait "$fork"
          wait "$upstream"
          bin/terraform-fork version
          bin/terraform-upstream version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: bin/
          retention-days: 3

  show:
    name: Show (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fewer, bigger modules: 56,000 objects in 100 modules.
          - name: wide
            modules: 100
            per_module: 100
          # Many small modules: 28,000 objects in 1,000 modules.
          - name: many-modules
            modules: 1000
            per_module: 5
    steps:
      - name: Get this workflow's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: bin

      - name: Start Vault and the Google API mock
        run: |
          set -euo pipefail
          chmod +x bin/*
          # For the time each command takes, its CPU time and its memory.
          [ -x /usr/bin/time ] || { sudo apt-get update -q && sudo apt-get install -y -q time; }
          docker run --detach --name vault -p 127.0.0.1:8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=tfperf-root -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            --cap-add IPC_LOCK hashicorp/vault:latest
          nohup python3 -I control/bench/gcpmock.py 8766 > gcpmock.log 2>&1 &
          for _ in $(seq 60); do
            if curl --silent --fail http://127.0.0.1:8200/v1/sys/health > /dev/null &&
              curl --silent http://127.0.0.1:8766/v1/projects/tfperf/topics/none > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Vault or the mock didn't start."
          docker logs vault
          exit 1

      - name: Measure
        env:
          MODULES: ${{ matrix.modules }}
          PER_MODULE: ${{ matrix.per_module }}
          RUNS: ${{ inputs.runs }}
        run: |
          mkdir scenario
          cd scenario
          ../control/bench/show.sh ../bin/terraform-fork ../bin/terraform-upstream ../out

      - name: Report
        if: always()
        env:
          NAME: ${{ matrix.name }}
          FORK_REF: ${{ inputs.fork_ref }}
          FORK_COMMIT: ${{ needs.build.outputs.fork_commit }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
        run: |
          {
            echo "### terraform show, scenario \"$NAME\""
            echo
            echo "Fork \`$FORK_REF\` at \`${FORK_COMMIT:0:12}\`, upstream at \`${UPSTREAM_COMMIT:0:12}\`."
            echo
            cat out/summary.md 2>/dev/null || echo "The measurement didn't finish. Its log says why."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: show-${{ matrix.name }}
          path: out/
          retention-days: 14
